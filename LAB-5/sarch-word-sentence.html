<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    n=prompt("enter sentence");
    word=prompt("enter word to search");
    index=n.indexOf(word);
    if(index!=-1)
    {
        document.write("Word found at index: " + index);
    }
    else
    {
        document.write("Word not found");
    }

    </script>
</body>
</html>
