<body>
    <script>
        n=parseInt(prompt("enter size of array "));
        a = [];
        
        for(i=0;i<n;i++){
            a[i]=prompt("enter a["+i+"]")
            
        }
        largest=a[0];
        for(i=0;i<n;i++){
           if(largest<a[i]){
            largest=a[i];
           }
            
        }
        document.write(largest)
 

    </script>
</body>
