<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        while(true){
        a=parseFloat(prompt("enter first number"));

        b=parseFloat(prompt("enter first number"));

        op=prompt("enter opration( + , - , / , * )")
        switch(op){
            case "+" :{
                alert("ans of "+a+"+"+b+" = " +(a+b));
                break;
            }
            case "-" :{
                alert("ans of "+a+"-"+b+" = " +(a-b));
                break;
            }
            case "/" :{
                alert("ans of "+a+"/"+b+" = " +(a/b));
                break;
            }
            case "*" :{
                alert("ans of "+a+"*"+b+" = " +(a*b));
                break;
            }
        }
        }
    </script>
</body>
</html>
