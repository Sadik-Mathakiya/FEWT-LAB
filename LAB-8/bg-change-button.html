<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn" onclick="change()">Chnage BG</button>
    <script>
        function change(){
            e = document.getElementsByTagName("body")[0]
            e.style.backgroundColor = "aqua"
        }
    </script>
</body>
</html>
