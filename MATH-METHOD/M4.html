<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        date = new Date();
        document.write("Current date : "+date.getDate());
        document.write("Current time : "+(date.getTime()/(1000*60*60*24)));
        document.write("Current day : "+date.getDay());
        document.write("Current month : "+date.getMonth());
        document.write("Current year : "+date.getFullYear());
    </script>
</body>
</html>
