<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        n = parseInt(prompt("enter number (two digits only) "))

        ld=n%10;
        fd=Math.floor(n/10);
        ans=1;
        for(i=0;i<ld;i++){
            ans=ans*fd;
        }
        document.write("ANS : "+ans)
    </script>
</body>

</html>
