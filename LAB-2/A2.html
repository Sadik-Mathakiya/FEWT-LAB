<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("enter number a for range prime number strat")
        b = prompt("enter number b for range prime number end")
        document.write("prime numbers is ")
        c=0
        for(i=a;i<=b;i++){
            for(j=2;j<i;j++){
                if(i%j==0){
                    c++
                }
            }
            if(c==0){
                document.write(" "+i)
            }
            c=0
        }
    </script>
</body>
</html>
